name: Terraform Apply Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply (Production Infrastructure)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Debug OIDC & AWS Configuration
        run: |
          echo "=========================================="
          echo "GitHub Actions Context"
          echo "=========================================="
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref Name: ${{ github.ref_name }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo ""
          echo "=========================================="
          echo "OIDC Token Information"
          echo "=========================================="
          
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "❌ ERROR: ACTIONS_ID_TOKEN_REQUEST_TOKEN is empty"
            echo "   Make sure 'id-token: write' is set in workflow permissions"
            exit 1
          else
            echo "✓ ACTIONS_ID_TOKEN_REQUEST_TOKEN is set"
          fi
          
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "❌ ERROR: ACTIONS_ID_TOKEN_REQUEST_URL is empty"
            exit 1
          else
            echo "✓ ACTIONS_ID_TOKEN_REQUEST_URL is set"
          fi
          
          echo ""
          echo "Requesting OIDC token..."
          OIDC_RESPONSE=$(curl -s "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          
          # Check if we got a valid response (GitHub masks sensitive tokens with ***)
          if echo "$OIDC_RESPONSE" | jq . &>/dev/null; then
            if echo "$OIDC_RESPONSE" | jq '.token' &>/dev/null; then
              echo "✓ OIDC token received successfully"
              echo "  (Token is masked in logs for security: ***)"
              echo "  Full response structure:"
              echo "$OIDC_RESPONSE" | jq .
            else
              echo "❌ ERROR: No token field in response"
              echo "Response: $OIDC_RESPONSE"
              exit 1
            fi
          else
            echo "❌ ERROR: Invalid JSON response"
            echo "Response: $OIDC_RESPONSE"
            exit 1
          fi
          
          echo ""
          echo "=========================================="
          echo "AWS Configuration"
          echo "=========================================="
          echo "AWS Role ARN (secret): ${{ secrets.AWS_OIDC_ROLE_ARN }}"
          echo "AWS Region: ap-south-2"
          echo "AWS Account ID (from Role ARN): $(echo ${{ secrets.AWS_OIDC_ROLE_ARN }} | cut -d: -f5)"
          
          echo ""
          echo "✓ All debug information collected"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-south-2
        timeout-minutes: 2

      - name: Test Manual Role Assumption
        if: failure()
        run: |
          echo "=========================================="
          echo "Manual OIDC Role Assumption Test"
          echo "=========================================="
          
          # Get fresh OIDC token
          OIDC_RESPONSE=$(curl -s "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          
          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.token')
          
          echo "Testing role assumption with token..."
          
          # Try to assume role manually
          ASSUME_RESPONSE=$(aws sts assume-role-with-web-identity \
            --role-arn ${{ secrets.AWS_OIDC_ROLE_ARN }} \
            --role-session-name github-actions-test \
            --web-identity-token "$OIDC_TOKEN" \
            --region ap-south-2 2>&1)
          
          echo "Response:"
          echo "$ASSUME_RESPONSE" | jq . || echo "$ASSUME_RESPONSE"
          
          # If manual test succeeds, it's an action issue
          if echo "$ASSUME_RESPONSE" | jq '.Credentials' &>/dev/null; then
            echo ""
            echo "\u2713 Manual role assumption SUCCEEDED"
            echo "  Issue is with aws-actions/configure-aws-credentials@v4"
          else
            echo ""
            echo "\u2717 Manual role assumption FAILED"
            echo "  Issue is with trust policy or token claims"
          fi

      - name: Verify AWS Credentials
        run: |
          echo "=========================================="
          echo "AWS Credentials Verification"
          echo "=========================================="
          
          # Check if AWS CLI is configured
          if ! command -v aws &> /dev/null; then
            echo "❌ AWS CLI not found"
            exit 1
          fi
          echo "✓ AWS CLI is available"
          
          # Check environment variables
          echo ""
          echo "Checking AWS environment variables:"
          [ -z "$AWS_ACCESS_KEY_ID" ] && echo "❌ AWS_ACCESS_KEY_ID is not set" || echo "✓ AWS_ACCESS_KEY_ID is set"
          [ -z "$AWS_SECRET_ACCESS_KEY" ] && echo "❌ AWS_SECRET_ACCESS_KEY is not set" || echo "✓ AWS_SECRET_ACCESS_KEY is set"
          [ -z "$AWS_SESSION_TOKEN" ] && echo "❌ AWS_SESSION_TOKEN is not set" || echo "✓ AWS_SESSION_TOKEN is set (temporary credentials)"
          
          echo ""
          echo "=========================================="
          echo "AWS STS Identity"
          echo "=========================================="
          
          # Get the current identity
          IDENTITY=$(aws sts get-caller-identity 2>&1)
          
          if [ $? -eq 0 ]; then
            echo "✓ Successfully authenticated with AWS"
            echo "$IDENTITY" | jq .
            
            # Extract details
            ACCOUNT=$(echo "$IDENTITY" | jq -r '.Account')
            ARN=$(echo "$IDENTITY" | jq -r '.Arn')
            USERID=$(echo "$IDENTITY" | jq -r '.UserId')
            
            echo ""
            echo "Account ID: $ACCOUNT"
            echo "ARN: $ARN"
            echo "UserID: $USERID"
          else
            echo "❌ Failed to get AWS identity"
            echo "Error: $IDENTITY"
            exit 1
          fi

      - name: Terraform Init & Apply (dev)
        run: |
          cd terraform/environments/dev
          terraform init
          terraform apply -auto-approve
