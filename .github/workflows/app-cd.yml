name: App CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/app-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, Push & Deploy to AWS ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug OIDC & AWS Configuration
        run: |
          echo "=========================================="
          echo "GitHub Actions Context"
          echo "=========================================="
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref Name: ${{ github.ref_name }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo ""
          echo "=========================================="
          echo "OIDC Token Information"
          echo "=========================================="
          
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "❌ ERROR: ACTIONS_ID_TOKEN_REQUEST_TOKEN is empty"
            echo "   Make sure 'id-token: write' is set in workflow permissions"
            exit 1
          else
            echo "✓ ACTIONS_ID_TOKEN_REQUEST_TOKEN is set"
          fi
          
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "❌ ERROR: ACTIONS_ID_TOKEN_REQUEST_URL is empty"
            exit 1
          else
            echo "✓ ACTIONS_ID_TOKEN_REQUEST_URL is set"
          fi
          
          echo ""
          echo "Requesting OIDC token..."
          OIDC_RESPONSE=$(curl -s "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          
          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.token // empty')
          
          if [ -z "$OIDC_TOKEN" ]; then
            echo "❌ ERROR: Failed to get OIDC token"
            echo "Response: $OIDC_RESPONSE"
            exit 1
          else
            echo "✓ OIDC token received"
          fi
          
          echo ""
          echo "=========================================="
          echo "OIDC Token Claims"
          echo "=========================================="
          # Decode JWT token (payload is the 2nd part)
          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d'.' -f2)
          # Add padding if needed
          PADDED_PAYLOAD="${PAYLOAD}=="
          DECODED=$(echo "$PADDED_PAYLOAD" | base64 -d 2>/dev/null | jq . 2>/dev/null || echo "Failed to decode")
          echo "$DECODED"
          
          echo ""
          echo "=========================================="
          echo "AWS Configuration"
          echo "=========================================="
          echo "AWS Role ARN (secret): ${{ secrets.AWS_OIDC_ROLE_ARN }}"
          echo "AWS Region: ap-south-2"
          echo "AWS Account ID (from Role ARN): $(echo ${{ secrets.AWS_OIDC_ROLE_ARN }} | cut -d: -f5)"
          
          echo ""
          echo "✓ All debug information collected"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-south-2

      - name: Verify AWS Credentials
        run: |
          echo "=========================================="
          echo "AWS Credentials Verification"
          echo "=========================================="
          
          # Check if AWS CLI is configured
          if ! command -v aws &> /dev/null; then
            echo "❌ AWS CLI not found"
            exit 1
          fi
          echo "✓ AWS CLI is available"
          
          # Check environment variables
          echo ""
          echo "Checking AWS environment variables:"
          [ -z "$AWS_ACCESS_KEY_ID" ] && echo "❌ AWS_ACCESS_KEY_ID is not set" || echo "✓ AWS_ACCESS_KEY_ID is set"
          [ -z "$AWS_SECRET_ACCESS_KEY" ] && echo "❌ AWS_SECRET_ACCESS_KEY is not set" || echo "✓ AWS_SECRET_ACCESS_KEY is set"
          [ -z "$AWS_SESSION_TOKEN" ] && echo "❌ AWS_SESSION_TOKEN is not set" || echo "✓ AWS_SESSION_TOKEN is set (temporary credentials)"
          
          echo ""
          echo "=========================================="
          echo "AWS STS Identity"
          echo "=========================================="
          
          # Get the current identity
          IDENTITY=$(aws sts get-caller-identity 2>&1)
          
          if [ $? -eq 0 ]; then
            echo "✓ Successfully authenticated with AWS"
            echo "$IDENTITY" | jq .
            
            # Extract details
            ACCOUNT=$(echo "$IDENTITY" | jq -r '.Account')
            ARN=$(echo "$IDENTITY" | jq -r '.Arn')
            USERID=$(echo "$IDENTITY" | jq -r '.UserId')
            
            echo ""
            echo "Account ID: $ACCOUNT"
            echo "ARN: $ARN"
            echo "UserID: $USERID"
          else
            echo "❌ Failed to get AWS identity"
            echo "Error: $IDENTITY"
            exit 1
          fi

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: dev-devops-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Download ECS Task Definition
        run: |
          aws ecs describe-task-definition --task-definition dev-app-task --query taskDefinition > task-definition.json

      - name: Update Container Image in Task Definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: dev-app
          image: ${{ env.IMAGE }}

      - name: Deploy Amazon ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: dev-service
          cluster: dev-cluster
          wait-for-service-stability: true
